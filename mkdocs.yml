# Project information
site_name: Javier Iparraguirre, Ph.D.
site_url: https://javierip.github.io/
site_author: Javier Iparraguirre
site_description: >-
  Director of Machine Learning at Teladoc Health, Professor at UTN FRBB, and researcher
  in efficient, self-supervised video models (JEPA). Fulbright Scholar.
repo_url: https://github.com/javierip/javierip.github.io
repo_name: javierip/javierip.github.io

# Copyright
copyright: "Copyright &copy; Javier Iparraguirre"

nav:
  - About: index.md
  - Leadership: leadership.md
  - Research: research.md
  - Contact: contact.md

# Configuration
theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  # Light mode is the default; colors are defined in stylesheets/extra.css
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - en
        - es
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          site_description: >-
            Director de Machine Learning en Teladoc Health, Profesor en la UTN FRBB e investigador
            en modelos de video eficientes y autosupervisados (JEPA). Becario Fulbright.
          nav_translations:
            About: Sobre mí
            Leadership: Liderazgo
            Research: Investigación
            Contact: Contacto
  # Old URLs that must keep working (the Projects page became Research)
  - redirects:
      redirect_maps:
        projects.md: research.md
        # The plugin can't resolve Spanish (*.es.md) targets, so use the full URL
        es/projects.md: https://javierip.github.io/es/research/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  generator: false
  analytics:
    provider: google
    property: G-8ZT4TE5E92
  social:
    - icon: fontawesome/regular/envelope
      link: mailto:j.iparraguirre@computer.org
      name: Email Javier
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jiparraguirre/
      name: Javier on LinkedIn
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=PNNFrAQAAAAJ&hl=en&view_op=list_works&sortby=pubdate
      name: Javier on Google Scholar
    - icon: fontawesome/brands/github
      link: https://github.com/javierip
      name: Javier on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/javieripa
      name: Javier on X
