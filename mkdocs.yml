# Project information
site_name: "Javier Iparraguirre"
site_description: "Director of Machine Learning | Video & Multimodal AI | PhD · Fulbright Scholar"
site_url: https://javierip.github.io/
repo_url: https://github.com/javierip/javierip.github.io
repo_name: javierip/javierip.github.io

# Copyright
copyright: "Copyright &copy; Javier Iparraguirre"

nav:
  - About: index.md
  - Research: projects.md
  - Contact: contact.md

# Configuration
theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.ico
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: light blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: light blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - toc.follow
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tooltips

plugins:
  - search:
      lang:
        - en
        - es
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          site_description: "Director de Machine Learning | Video e IA multimodal | Doctor · Becario Fulbright"
          nav_translations:
            About: Sobre mí
            Research: Investigación
            Contact: Contacto

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  generator: false
  analytics:
    provider: google
    property: G-8ZT4TE5E92
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/javierip
      name: Javier on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jiparraguirre/
      name: Javier on LinkedIn
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=PNNFrAQAAAAJ&hl=en&view_op=list_works&sortby=pubdate
      name: Javier on Google Scholar
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/javieripa
      name: Javier on X
    - icon: fontawesome/regular/envelope
      link: mailto:j.iparraguirre@computer.org
      name: Email Javier
